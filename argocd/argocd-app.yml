apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: employee-project
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/vk67220/springboot-thymeleaf-crud-pagination-sorting-webapp.git
    targetRevision: master
    path: k8s

  destination:
    server: https://kubernetes.default.svc

    namespace: vk67220-ns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true


  #########################################################
  # IGNORE DYNAMIC KUBERNETES CHANGES
  #########################################################
  ignoreDifferences:

    #####################################################
    # IGNORE HPA REPLICA CHANGES
    #####################################################
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas

    #####################################################
    # IGNORE INGRESS STATUS
    #####################################################
    - group: networking.k8s.io
      kind: Ingress
      jsonPointers:
        - /status

    #####################################################
    # IGNORE CERTIFICATE STATUS
    #####################################################
    - group: cert-manager.io
      kind: Certificate
      jsonPointers:
        - /status