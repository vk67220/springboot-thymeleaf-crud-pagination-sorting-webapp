apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: monitoring-project
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/vk67220/springboot-thymeleaf-crud-pagination-sorting-webapp.git
    targetRevision: master
    path: monitoring
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:

    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true