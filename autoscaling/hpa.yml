---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: employee-app-hpa
  namespace: vk67220-ns
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: employee-app
  minReplicas: 1
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
---