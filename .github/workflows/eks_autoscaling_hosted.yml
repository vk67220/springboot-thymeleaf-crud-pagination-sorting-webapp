name: Enterprise DevSecOps AutoScaling Pipeline

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - production

jobs:
  autoscaling:
    runs-on: self-hosted

    environment: ${{ inputs.target_env }}

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}

    steps:

      #########################################################
      # STEP 1 - CHECKOUT SOURCE CODE
      #########################################################
      - name: Checkout Code
        uses: actions/checkout@v4

      #########################################################
      # STEP 2 - VERIFY TOOLS
      #########################################################
      - name: Verify Installed Tools
        run: |

          kubectl version --client

          aws --version

      #########################################################
      # STEP 3 - CONFIGURE AWS CREDENTIALS
      #########################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ secrets.AWS_REGION }}

      #########################################################
      # STEP 4 - VERIFY AWS LOGIN
      #########################################################
      - name: Verify AWS Identity
        run: |

          aws sts get-caller-identity

      #########################################################
      # STEP 5 - CONFIGURE KUBECONFIG
      #########################################################
      - name: Configure kubeconfig
        run: |

          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${CLUSTER_NAME}

      #########################################################
      # STEP 6 - VERIFY EKS CLUSTER
      #########################################################
      - name: Verify EKS Cluster
        run: |

          kubectl get nodes

      #########################################################
      # STEP 7 - VERIFY METRICS SERVER
      #########################################################
      - name: Verify Metrics Server
        run: |

          kubectl get apiservices | grep metrics || true

      #########################################################
      # STEP 8 - VERIFY NAMESPACE
      #########################################################
      - name: Verify Namespace
        run: |

          kubectl get namespace vk67220-ns || \
          kubectl create namespace vk67220-ns

      #########################################################
      # STEP 9 - APPLY AUTOSCALING YAML FILES
      #########################################################
      - name: Deploy AutoScaling Resources
        run: |

          kubectl apply -f autoscaling/

      #########################################################
      # STEP 10 - VERIFY HPA
      #########################################################
      - name: Verify HPA
        run: |

          kubectl get hpa -n vk67220-ns

          kubectl describe hpa employee-app-hpa \
            -n vk67220-ns

      #########################################################
      # STEP 11 - VERIFY DEPLOYMENT
      #########################################################
      - name: Verify Deployment
        run: |

          kubectl get deployment \
            -n vk67220-ns

      #########################################################
      # STEP 12 - VERIFY PODS
      #########################################################
      - name: Verify Pods
        run: |

          kubectl get pods -n vk67220-ns

      #########################################################
      # STEP 13 - VERIFY SERVICES
      #########################################################
      - name: Verify Services
        run: |

          kubectl get svc -n vk67220-ns

      #########################################################
      # STEP 14 - VERIFY STATEFULSET
      #########################################################
      - name: Verify StatefulSet
        run: |

          kubectl get statefulset -n vk67220-ns

      #########################################################
      # STEP 15 - VERIFY PVC
      #########################################################
      - name: Verify PVC
        run: |

          kubectl get pvc -n vk67220-ns

      #########################################################
      # STEP 16 - VERIFY METRICS
      #########################################################
      - name: Verify Metrics
        run: |

          kubectl top pods -n vk67220-ns || true

          kubectl top nodes || true

      #########################################################
      # STEP 17 - VERIFY HPA WATCH
      #########################################################
      - name: Watch HPA
        run: |

          kubectl get hpa employee-app-hpa \
            -n vk67220-ns

      #########################################################
      # STEP 18 - VERIFY APPLICATION URL
      #########################################################
      - name: Get Application URL
        run: |

          kubectl get svc employee-app-svc \
            -n vk67220-ns

      #########################################################
      # STEP 19 - VERIFY ROLLOUT STATUS
      #########################################################
      - name: Verify Rollout
        run: |

          kubectl rollout status deployment/employee-app \
            -n vk67220-ns \
            --timeout=300s