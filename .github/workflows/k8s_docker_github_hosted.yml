name: DevSecOps Pipeline (Docker Compose + EKS)

on:
  workflow_dispatch:

jobs:
  devsecops:
    runs-on: self-hosted

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}

    steps:

      #########################################
      # STEP 1 - Checkout Code
      #########################################
      - name: Checkout Code
        uses: actions/checkout@v4

      #########################################
      # STEP 2 - Setup Java
      #########################################
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      #########################################
      # STEP 4 - Set Version
      #########################################
      - name: Set Version
        run: |
          VERSION=0.0.${GITHUB_RUN_NUMBER}
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      #########################################
      # STEP 5 - Maven Build
      #########################################
      - name: Maven Build
        run: |
          mvn clean package -DskipTests

      #########################################
      # STEP 6 - SonarQube Scan
      #########################################
      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=employees \
            -Dsonar.projectName=employees \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true

      #########################################
      # STEP 7 - Trivy FileSystem Scan
      #########################################
      - name: Trivy FileSystem Scan
        run: |
          trivy fs . > trivyfs-report.txt

      #########################################
      # STEP 8 - Build Docker Image
      #########################################
      - name: Build Docker Image
        run: |
          docker build -t employees-app:${VERSION} .
          docker tag employees-app:${VERSION} employees-app:latest

      #########################################
      # STEP 9 - Trivy Docker Image Scan
      #########################################
      - name: Trivy Docker Image Scan
        run: |
          trivy image employees-app:${VERSION}

      #########################################
      # STEP 10 - DockerHub Login
      #########################################
      - name: DockerHub Login
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

      #########################################
      # STEP 11 - Tag Docker Image
      #########################################
      - name: Tag Docker Image
        run: |
          docker tag employees-app:${VERSION} $DOCKER_USERNAME/employees-app:${VERSION}
          docker tag employees-app:${VERSION} $DOCKER_USERNAME/employees-app:latest

      #########################################
      # STEP 12 - Push Docker Image
      #########################################
      - name: Push Docker Image
        run: |
          docker push $DOCKER_USERNAME/employees-app:${VERSION}
          docker push $DOCKER_USERNAME/employees-app:latest

      #########################################
      # STEP 13 - Local Docker Compose Deployment
      #########################################
      - name: Deploy Docker Compose
        run: |
          docker-compose down || true
          docker-compose up -d

      #########################################
      # STEP 14 - Verify Local Containers
      #########################################
      - name: Verify Local Containers
        run: |
          docker ps

      #########################################
      # STEP 15 - Verify AWS Identity
      #########################################
      - name: Verify AWS Identity
        run: |
          aws sts get-caller-identity

      #########################################
      # STEP 16 - Update kubeconfig
      #########################################
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${CLUSTER_NAME}

      #########################################
      # STEP 17 - Verify Kubernetes Cluster
      #########################################
      - name: Verify Kubernetes Cluster
        run: |
          kubectl get nodes

      #########################################
      # STEP 18 - Deploy Kubernetes YAML Files
      #########################################
      - name: Deploy Kubernetes YAML Files
        run: |
          kubectl apply -f k8s/

      #########################################
      # STEP 19 - Verify Kubernetes Rollout
      #########################################
      - name: Verify Kubernetes Rollout
        run: |
          kubectl rollout status deployment/employee-app -n vk67220-ns

      #########################################
      # STEP 20 - Verify Kubernetes Resources
      #########################################
      - name: Verify Kubernetes Resources
        run: |
          kubectl get all -n vk67220-ns
          kubectl get pvc -n vk67220-ns
          kubectl get sc -n vk67220-ns