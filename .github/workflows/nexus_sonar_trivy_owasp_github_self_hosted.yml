name: CI Pipeline (Sonar + OWASP + Trivy + Nexus - Final)

on:
  workflow_dispatch:

jobs:
  security-pipeline:
    runs-on: self-hosted

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

    steps:

      # 🔹 Checkout
      - name: Checkout Code
        uses: actions/checkout@v4

      # 🔹 Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔹 Configure Maven (Nexus auth)
      - name: Configure Maven settings.xml
        run: |
          mkdir -p ~/.m2
          cat <<EOF > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>nexus</id>
                <username>${NEXUS_USERNAME}</username>
                <password>${NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      # =========================
      # 🔥 STEP 0: AUTO VERSIONING
      # =========================
      - name: Set Dynamic Version
        run: |
          VERSION=0.0.${GITHUB_RUN_NUMBER}
          echo "Using version: $VERSION"
          mvn versions:set -DnewVersion=$VERSION
          mvn versions:commit

      # =========================
      # 🔥 STEP 1: BUILD
      # =========================
      - name: Build
        run: mvn clean compile

      # =========================
      # 🔥 STEP 2: TEST
      # =========================
      - name: Test
        run: mvn test -DskipTests

      # =========================
      # 🔥 STEP 3: SONARQUBE + QUALITY GATE
      # =========================
      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=employees \
            -Dsonar.projectName=employees \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true

      # =========================
      # 🔥 STEP 4: OWASP DEPENDENCY CHECK
      # =========================
      #- name: OWASP Dependency Check
       # run: |
        #  mvn org.owasp:dependency-check-maven:check

      #- name: OWASP Dependency Check
       #  run: |
        #   mvn org.owasp:dependency-check-maven:check \
         #  -Dnvd.api.key=${{ secrets.NVD_API_KEY }}

     # - name: OWASP Dependency Check
      #  run: |
       #   mvn org.owasp:dependency-check-maven:check \
        #  -DskipUpdates=true

      # =========================
      # 🔥 STEP 5: TRIVY STRICT SCAN
      # =========================
      - name: Trivy Scan
        run: |
          trivy fs . > trivyfs.txt
          #trivy fs . --exit-code 1 --severity HIGH,CRITICAL
          

      # 🔹 Upload Trivy Report
      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivyfs.txt

      # =========================
      # 🔥 STEP 6: PACKAGE
      # =========================
      - name: Package
        run: mvn package -DskipTests

      # =========================
      # 🚀 STEP 7: DEPLOY TO NEXUS
      # =========================
      - name: Deploy to Nexus
        run: mvn deploy -DskipTests