name: DevSecOps HTTPS Ingress Pipeline with HPA 

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Select Environment"
        required: true
        type: choice
        options:
          - dev
          - production

jobs:
  devsecops:
    runs-on: self-hosted

    environment: ${{ inputs.target_env }}

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      AWS_REGION: ${{ secrets.AWS_REGION }}

      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}

      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}

      ECR_REPO: employees-app-dev

    steps:

      #########################################################
      # STEP 1 - CHECKOUT SOURCE CODE
      #########################################################
      - name: Checkout Code
        uses: actions/checkout@v4

      #########################################################
      # STEP 2 - SETUP JAVA
      #########################################################
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      #########################################################
      # STEP 3 - SET VERSION
      #########################################################
      - name: Set Version
        run: |

          VERSION=0.0.${GITHUB_RUN_NUMBER}

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      #########################################################
      # STEP 4 - VERIFY TOOLS
      #########################################################
      - name: Verify Installed Tools
        run: |

          java -version

          mvn -version

          docker --version

          docker-compose --version

          kubectl version --client

          aws --version

      #########################################################
      # STEP 5 - MAVEN BUILD
      #########################################################
      - name: Maven Build
        run: |

          mvn clean package -DskipTests

      #########################################################
      # STEP 6 - SONARQUBE SCAN
      #########################################################
      - name: SonarQube Scan
        run: |

          mvn sonar:sonar \
            -Dsonar.projectKey=employees \
            -Dsonar.projectName=employees \
            -Dsonar.host.url=${SONAR_HOST_URL} \
            -Dsonar.login=${SONAR_TOKEN} \
            -Dsonar.qualitygate.wait=true

      #########################################################
      # STEP 7 - TRIVY FILE SYSTEM SCAN
      #########################################################
      - name: Trivy FS Scan
        run: |

          trivy fs . > trivyfs.txt

      #########################################################
      # STEP 8 - BUILD DOCKER IMAGE
      #########################################################
      - name: Build Docker Image
        run: |

          docker build -t employees-app:${VERSION} .

          docker tag employees-app:${VERSION} employees-app:latest

      #########################################################
      # STEP 9 - TRIVY IMAGE SCAN
      #########################################################
      - name: Trivy Image Scan
        run: |

          trivy image employees-app:${VERSION}

      #########################################################
      # STEP 10 - CONFIGURE AWS CREDENTIALS
      #########################################################
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ secrets.AWS_REGION }}

      #########################################################
      # STEP 11 - VERIFY AWS LOGIN
      #########################################################
      - name: Verify AWS Identity
        run: |

          aws sts get-caller-identity

      #########################################################
      # STEP 12 - LOGIN TO ECR
      #########################################################
      - name: Login to ECR
        run: |

          aws ecr get-login-password --region $AWS_REGION \
          | docker login \
          --username AWS \
          --password-stdin \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

      #########################################################
      # STEP 13 - TAG IMAGE FOR ECR
      #########################################################
      - name: Tag Image for ECR
        run: |

          docker tag employees-app:${VERSION} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:${VERSION}

          docker tag employees-app:${VERSION} \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest

      #########################################################
      # STEP 14 - PUSH IMAGE TO ECR
      #########################################################
      - name: Push Image to ECR
        run: |

          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:${VERSION}

          docker push \
          $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO:latest

      #########################################################
      # STEP 15 - LOCAL DOCKER COMPOSE DEPLOY
      #########################################################
      - name: Deploy Containers
        run: |

          docker-compose down || true

          docker-compose up -d

      #########################################################
      # STEP 16 - VERIFY LOCAL CONTAINERS
      #########################################################
      - name: Verify Running Containers
        run: |

          docker ps

      #########################################################
      # STEP 17 - CONFIGURE KUBECONFIG
      #########################################################
      - name: Configure kubeconfig
        run: |

          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${CLUSTER_NAME}

      #########################################################
      # STEP 18 - VERIFY EKS CLUSTER
      #########################################################
      - name: Verify EKS Cluster
        run: |

          kubectl get nodes

      #########################################################
      # STEP 19 - CREATE NAMESPACE
      #########################################################
      - name: Create Namespace
        run: |

          kubectl get namespace vk67220-ns || \
          kubectl create namespace vk67220-ns

      #########################################################
      # STEP 20 - DEPLOY K8S RESOURCES
      #########################################################
      - name: Deploy Kubernetes Resources
        run: |

          kubectl apply -f k8s/

      #########################################################
      # STEP 21 - APPLY AUTOSCALING
      #########################################################
      - name: Apply HPA
        run: |

          kubectl apply -f autoscaling/hpa.yml

      #########################################################
      # STEP 22 - VERIFY HPA
      #########################################################
      - name: Verify HPA
        run: |

          kubectl get hpa -n vk67220-ns

      #########################################################
      # STEP 23 - APPLY CLUSTER ISSUER
      #########################################################
      - name: Apply ClusterIssuer
        run: |

          kubectl apply -f ingress/cluster-issuer.yml

      #########################################################
      # STEP 24 - APPLY HTTPS INGRESS
      #########################################################
      - name: Apply HTTPS Ingress
        run: |

          kubectl apply -f ingress/ingress.yml

      #########################################################
      # STEP 25 - VERIFY INGRESS
      #########################################################
      - name: Verify Ingress
        run: |

          kubectl get ingress -n vk67220-ns

      #########################################################
      # STEP 26 - VERIFY TLS CERTIFICATE
      #########################################################
      - name: Verify TLS Certificate
        run: |

          kubectl get certificate -n vk67220-ns || true

      #########################################################
      # STEP 27 - VERIFY DEPLOYMENT
      #########################################################
      - name: Verify Deployment
        run: |

          kubectl get deployment -n vk67220-ns

      #########################################################
      # STEP 28 - VERIFY PODS
      #########################################################
      - name: Verify Pods
        run: |

          kubectl get pods -n vk67220-ns

      #########################################################
      # STEP 29 - VERIFY SERVICES
      #########################################################
      - name: Verify Services
        run: |

          kubectl get svc -n vk67220-ns

      #########################################################
      # STEP 30 - VERIFY STATEFULSET
      #########################################################
      - name: Verify StatefulSet
        run: |

          kubectl get statefulset -n vk67220-ns

      #########################################################
      # STEP 31 - VERIFY PVC
      #########################################################
      - name: Verify PVC
        run: |

          kubectl get pvc -n vk67220-ns

      #########################################################
      # STEP 32 - VERIFY METRICS
      #########################################################
      - name: Verify Metrics
        run: |

          kubectl top pods -n vk67220-ns || true

      #########################################################
      # STEP 33 - VERIFY ROLLOUT STATUS
      #########################################################
      - name: Verify Rollout
        run: |

          kubectl rollout status deployment/employee-app \
            -n vk67220-ns \
            --timeout=300s

      #########################################################
      # STEP 34 - CLEANUP OLD DOCKER IMAGES
      #########################################################
      - name: Cleanup Docker Images
        run: |

          docker image prune -a -f